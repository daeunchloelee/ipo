name: 실제 실적 자동 갱신

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-actuals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_actuals.py
      - run: |
          git config user.name "ipo-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/actuals.json data/corp_codes.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 실제 실적 자동 갱신 [skip ci]"
            git push
          fi
