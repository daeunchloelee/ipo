name: 종가 자동 갱신

on:
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 버튼
  schedule:
    - cron: "0 7 * * 1-5"     # KST 16:00 = UTC 07:00, 월~금

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_prices.py
      - run: |
          git config user.name "ipo-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 현재가 자동 갱신 [skip ci]"
            git push
          fi
